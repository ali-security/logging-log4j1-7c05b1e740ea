name: seal-build

# Upstream log4j 1.2.x has no GitHub Actions CI. This workflow runs the
# project's own Maven build: `mvn clean verify` compiles the jar, and the
# pom's antrun `runAll` execution (test phase) runs the regression suite in
# tests/build.xml. Maven and the tests run inside maven:3-jdk-7 via
# `docker run` (not `container:`) because the runner's node20 actions cannot
# start inside that image's old glibc.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated tests/build.xml test targets (e.g. 'Core SocketServer'); empty runs the full runAll suite"
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build and test (full suite, mvn clean verify -> antrun runAll)
        if: inputs.test-filter == ''
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/workdir -w /workdir \
            -e MAVEN_OPTS="-Dhttps.protocols=TLSv1.2" \
            maven:3-jdk-7 \
            mvn -B -e clean verify -Dmaven.site.skip=true

      - name: Fetch Ant (filtered test run only)
        if: inputs.test-filter != ''
        run: |
          curl -sSfL https://archive.apache.org/dist/ant/binaries/apache-ant-1.9.16-bin.tar.gz | tar -xz -C "$RUNNER_TEMP"

      - name: Build jar and run selected tests
        if: inputs.test-filter != ''
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/workdir -w /workdir \
            -v "$RUNNER_TEMP/apache-ant-1.9.16":/opt/ant \
            -e MAVEN_OPTS="-Dhttps.protocols=TLSv1.2" \
            maven:3-jdk-7 \
            bash -ec '
              mvn -B -e clean test-compile org.apache.felix:maven-bundle-plugin:2.1.0:bundle -Dmaven.site.skip=true
              /opt/ant/bin/ant -f tests/build.xml \
                -Dm2_repo=/root/.m2/repository \
                -Dlog4j.jar=/workdir/target/classes \
                -Dproject.lib.home=/workdir/target \
                ${{ inputs.test-filter }}
            '

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: log4j-jar
          path: target/log4j-1.2.17.jar
          if-no-files-found: error
